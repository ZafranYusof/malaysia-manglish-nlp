site_name: manglish-nlp
site_description: Full NLP toolkit for Malaysian Manglish
site_url: https://zafranyusof.github.io/manglish-nlp/
repo_url: https://github.com/ZafranYusof/manglish-nlp
repo_name: ZafranYusof/manglish-nlp

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  language: en

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - Overview: modules/index.md
      - Text Processing: modules/text-processing.md
      - Analysis: modules/analysis.md
      - Extraction: modules/extraction.md
      - Advanced: modules/advanced.md
      - Generation: modules/generation.md
      - Data & Embeddings: modules/data.md
      - Tools & Utilities: modules/tools.md
      - Integrations: modules/integrations.md
  - API Reference: api-reference.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
  - Changelog: changelog.md
