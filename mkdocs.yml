    - Pretrained Models: pretrained-models.md
    - Datasets: datasets.md
    - Contributing: contributing.md
    - Changelog: changelog.md
  - API: api-reference.md
  - Modules:
    - Overview: modules/index.md
    - Text Processing: modules/text-processing.md
    - Analysis: modules/analysis.md
    - Extraction: modules/extraction.md
    - Advanced: modules/advanced.md
    - Generation: modules/generation.md
    - Data & Embeddings: modules/data.md
    - Tools & Utilities: modules/tools.md
    - Integrations: modules/integrations.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Sentiment Analysis: tutorials/sentiment.md
    - Named Entity Recognition: tutorials/ner.md
    - Translation: tutorials/translation.md
    - Normalization: tutorials/normalization.md
    - Language Detection: tutorials/language-detection.md
    - Embeddings: tutorials/embeddings.md
    - Summarization: tutorials/summarization.md
    - Question Answering: tutorials/qa.md
    - Emotion Detection: tutorials/emotion.md
    - Hate Speech: tutorials/hate-speech.md
    - Code-Switching: tutorials/code-switching.md
    - Pipeline: tutorials/pipeline.md
