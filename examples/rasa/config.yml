recipe: default.v1
language: en

pipeline:
  # manglish-nlp custom component (see nlu_component.py)
  - name: "nlu_component.ManglishNLPFeaturizer"
    # Uses manglish-nlp normalisation + embeddings for features

  - name: "nlu_component.ManglishNERExtractor"
    # Uses manglish-nlp NER for entity extraction

  - name: WhitespaceTokenizer

  - name: RegexFeaturizer

  - name: LexicalSyntacticFeaturizer

  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  - name: EntitySynonymMapper

  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

  - name: FallbackClassifier
    threshold: 0.3
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy

  - name: RulePolicy

  - name: TEDPolicy
    max_history: 5
    epochs: 100

  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
