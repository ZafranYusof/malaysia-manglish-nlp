<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004D40"/>
      <stop offset="100%" style="stop-color:#00897B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Geometric decorations -->
  <circle cx="120" cy="80" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="120" cy="80" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="1160" cy="560" r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="1160" cy="560" r="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="1050" cy="120" r="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="200" cy="520" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Subtle lines -->
  <line x1="0" y1="200" x2="300" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="980" y1="440" x2="1280" y2="440" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="1200" y1="480" x2="1200" y2="640" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Dot grid pattern -->
  <g fill="rgba(255,255,255,0.03)">
    <circle cx="400" cy="100" r="2"/><circle cx="440" cy="100" r="2"/><circle cx="480" cy="100" r="2"/>
    <circle cx="520" cy="100" r="2"/><circle cx="560" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="400" cy="140" r="2"/><circle cx="440" cy="140" r="2"/><circle cx="480" cy="140" r="2"/>
    <circle cx="520" cy="140" r="2"/><circle cx="560" cy="140" r="2"/><circle cx="600" cy="140" r="2"/>
    <circle cx="400" cy="180" r="2"/><circle cx="440" cy="180" r="2"/><circle cx="480" cy="180" r="2"/>
    <circle cx="520" cy="180" r="2"/><circle cx="560" cy="180" r="2"/><circle cx="600" cy="180" r="2"/>
    <circle cx="700" cy="460" r="2"/><circle cx="740" cy="460" r="2"/><circle cx="780" cy="460" r="2"/>
    <circle cx="820" cy="460" r="2"/><circle cx="860" cy="460" r="2"/><circle cx="900" cy="460" r="2"/>
    <circle cx="700" cy="500" r="2"/><circle cx="740" cy="500" r="2"/><circle cx="780" cy="500" r="2"/>
    <circle cx="820" cy="500" r="2"/><circle cx="860" cy="500" r="2"/><circle cx="900" cy="500" r="2"/>
    <circle cx="700" cy="540" r="2"/><circle cx="740" cy="540" r="2"/><circle cx="780" cy="540" r="2"/>
    <circle cx="820" cy="540" r="2"/><circle cx="860" cy="540" r="2"/><circle cx="900" cy="540" r="2"/>
  </g>

  <!-- Title -->
  <text x="640" y="260" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-1">manglish-nlp</text>

  <!-- Subtitle -->
  <text x="640" y="320" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.75)" font-weight="300">The Complete NLP Toolkit for Malaysian Manglish</text>

  <!-- Feature badges -->
  <g transform="translate(640, 440)">
    <!-- Badge 1: 52 Modules -->
    <g transform="translate(-220, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.9)">52 Modules</text>
    </g>
    <!-- Badge 2: Zero Dependencies -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.9)">Zero Dependencies</text>
    </g>
    <!-- Badge 3: 23k+ texts/sec -->
    <g transform="translate(220, 0)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.9)">23k+ texts/sec</text>
    </g>
  </g>
</svg>
