<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60">
  <!-- manglish-nlp wordmark logo -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00897B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Malaysian crescent + star accent -->
  <g transform="translate(8, 18)" opacity="0.85">
    <!-- Crescent -->
    <path d="M12,0 A12,12 0 1,0 12,24 A9,9 0 1,1 12,0 Z" fill="#00897B"/>
    <!-- Star -->
    <polygon points="26,12 28.5,8 31,12 28,9.5 30.5,6 27,8.5 24,6 26.5,9.5 23.5,12 26,9.5" fill="#00BCD4"/>
  </g>

  <!-- Main text: "manglish" -->
  <text x="50" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">manglish</text>

  <!-- Accent text: "-nlp" -->
  <text x="195" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#00BCD4" letter-spacing="-0.5">-nlp</text>
</svg>
