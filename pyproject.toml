[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manglish-nlp"
version = "3.0.0"
description = "Full NLP toolkit for Malaysian Manglish — 51 modules, zero dependencies for core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Zafran"}
]
keywords = ["nlp", "malay", "manglish", "sentiment", "ner", "text-processing", "malaysian"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Malay",
]

[project.urls]
Homepage = "https://github.com/zafran/manglish-nlp"
Documentation = "https://github.com/zafran/manglish-nlp#readme"
Issues = "https://github.com/zafran/manglish-nlp/issues"
Changelog = "https://github.com/zafran/manglish-nlp/blob/main/CHANGELOG.md"

[project.scripts]
manglish = "manglish_nlp.__main__:main"

[project.optional-dependencies]
transformers = ["transformers>=4.20.0", "torch>=1.12.0"]
embeddings = ["sentence-transformers>=2.2.0"]
spacy = ["spacy>=3.4.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
langchain = ["langchain-core>=0.1.0"]
all = [
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "langchain-core>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["manglish_nlp*"]

[tool.setuptools.package-data]
manglish_nlp = ["resources/*.json", "resources/*.model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
