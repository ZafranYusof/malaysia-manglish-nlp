name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short -x

      - name: Run with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest tests/ --cov=malaysian_manglish_nlp --cov-report=xml -q

      - name: Import check
        run: |
          python -c "import malaysian_manglish_nlp; print(f'malaysian-manglish-nlp loaded: {len(malaysian_manglish_nlp.__all__)} modules')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check malaysian_manglish_nlp/ --select E,F --ignore E501,E402
